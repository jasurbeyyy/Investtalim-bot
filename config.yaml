rasm:
  ai_fon_ehtimoli: 0.35        # dars postlarida bepul AI fotosurat fon ishlatish ehtimoli (0 = hech qachon, 1 = doim)
  ai_fon_tabrik: 0.5           # Xayrli tong/tun rasmlarida AI fotosurat ehtimoli

ai:
  # Bepul Gemini modellari (birinchisi ishlamasa keyingisi sinaladi)
  gemini_modellar: [gemini-2.5-flash, gemini-flash-latest, gemini-2.5-flash-lite]
  groq_model: llama-3.3-70b-versatile
