name: Kanal postlari
run-name: "${{ inputs.rejim || 'jadval' }} ${{ inputs.tur }}"

# Bot o'zini o'zi navbatma-navbat ishga tushiradi: har bir ishga tushirish navbatdagi postni
# (ko'pi bilan ~5 soat oldindan) kutadi, chiqaradi va keyingisini ishga tushiradi.
# "Qorovul" (qorovul.yml) zanjir uzilib qolsa, uni qayta boshlaydi.
on:
  workflow_dispatch:
    inputs:
      tur:
        description: "Qaysi post: en / ar / ru / tong / tun"
        required: true
        default: "en"
        type: choice
        options: [en, ar, ru, tong, tun]
      rejim:
        description: "sinov = faqat sizga keladi (📤 bossangiz chiqadi); hozir = 10 daqiqadan keyin kanalga chiqadi"
        required: true
        default: "sinov"
        type: choice
        options: [sinov, hozir, jadval, tekshiruv]

concurrency:
  group: kanal-postlari
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Boshlanish vaqti
        run: echo "BOSHLANDI=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Arab yozuvi uchun kutubxona
        run: sudo apt-get install -y -qq libfribidi0 > /dev/null || true

      - name: Kutubxonalarni o'rnatish
        run: pip install -q -r requirements.txt

      - name: Postni tayyorlash va chiqarish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "${{ inputs.rejim }}" in
            tekshiruv) python diag.py ;;
            sinov)     python runner.py --tur "${{ inputs.tur }}" --test ;;
            hozir)     python runner.py --tur "${{ inputs.tur }}" --hozir ;;
            *)         python runner.py --zanjir ;;
          esac

      - name: Holatni saqlash (takrorlanmasligi uchun)
        if: always()
        run: |
          git config user.name "investtalim-bot"
          git config user.email "investtalim-bot@users.noreply.github.com"
          git add state.json jurnal.txt 2>/dev/null || git add state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "holat yangilandi"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done || echo "holatni saqlab bo'lmadi"
          fi

      - name: Navbatdagi ishga tushirish
        if: always() && inputs.rejim != 'tekshiruv'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          o=$(( $(date +%s) - BOSHLANDI ))
          if [ "${{ inputs.rejim }}" = "jadval" ] && [ ! -f erta_chiqish ] && [ "$o" -lt 300 ]; then
            echo "Juda tez tugadi — 10 daqiqa kutiladi"; sleep $(( 600 - o ))
          fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/postlar.yml/dispatches" \
            -f ref=main -f 'inputs[tur]=en' -f 'inputs[rejim]=jadval' && echo "Keyingisi ishga tushirildi"
